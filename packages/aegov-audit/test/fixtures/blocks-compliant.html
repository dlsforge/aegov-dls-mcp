<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Compliant header/footer blocks — no block contract may fire (false-positive gate)</title>
</head>
<body>
  <!--
    Built to the documented header and footer blocks
    (designsystem.gov.ae/docs/blocks/header, /footer), reduced to the structure
    the contracts actually assert: the block roots, the mobile affordances, a
    primary navigation within the 7-item limit, and a dynamic copyright year.
    Two nav-menu lists (desktop + mobile) of 7 items each, exactly as the docs
    ship them — the case that forced per-list counting.
  -->
  <header class="aegov-header">
    <div class="header-desktop">
      <a href="/" class="logo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M0 0h24v24H0z"/></svg><span>Entity</span></a>
      <nav class="main-navigation" aria-label="Main navigation">
        <div class="menu-main-menu-container">
          <ul class="menu nav-menu">
            <li class="menu-item"><a href="/">Home</a></li>
            <li class="menu-item"><a href="/services">Services</a></li>
            <li class="menu-item"><a href="/digital-participation">Digital participation</a></li>
            <li class="menu-item"><a href="/open-data">Open data</a></li>
            <li class="menu-item"><a href="/about">About</a></li>
            <li class="menu-item"><a href="/media">Media</a></li>
            <li class="menu-item"><a href="/contact">More</a></li>
          </ul>
        </div>
      </nav>
      <button type="button" data-modal-target="openMenu" data-modal-toggle="openMenu" aria-controls="openMenu" class="menu-toggle">
        <span class="sr-only">Toggle main menu</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M0 0h24v24H0z"/></svg>
      </button>
    </div>
    <div id="openMenu" tabindex="-1" aria-hidden="true" class="responsive-menu">
      <nav class="main-navigation" aria-label="Main navigation">
        <div class="menu-main-menu-container">
          <ul class="menu nav-menu">
            <li class="menu-item"><a href="/">Home</a></li>
            <li class="menu-item"><a href="/services">Services</a></li>
            <li class="menu-item"><a href="/digital-participation">Digital participation</a></li>
            <li class="menu-item"><a href="/open-data">Open data</a></li>
            <li class="menu-item"><a href="/about">About</a></li>
            <li class="menu-item"><a href="/media">Media</a></li>
            <li class="menu-item"><a href="/contact">More</a></li>
          </ul>
        </div>
      </nav>
    </div>
  </header>

  <main id="main">
    <h1>Compliant block fixture</h1>
  </main>

  <footer class="aegov-footer">
    <div class="footer-top">
      <nav aria-label="footer navigation" class="aegov-accordion aegov-mobile-accordion" id="mobile-accordion-collapse" data-accordion="collapse">
        <h2 id="mobile-accordion-collapse-heading-1">
          <button type="button" aria-label="heading" aria-expanded="true" aria-controls="mobile-accordion-collapse-body-1" data-accordion-target="#mobile-accordion-collapse-body-1">
            About the entity
          </button>
        </h2>
        <div id="mobile-accordion-collapse-body-1" aria-labelledby="mobile-accordion-collapse-heading-1">
          <a href="/about">About us</a>
          <a href="/leadership">Leadership</a>
        </div>
        <h2 id="mobile-accordion-collapse-heading-2">
          <button type="button" aria-label="heading" aria-expanded="false" aria-controls="mobile-accordion-collapse-body-2" data-accordion-target="#mobile-accordion-collapse-body-2">
            Services
          </button>
        </h2>
        <div id="mobile-accordion-collapse-body-2" aria-labelledby="mobile-accordion-collapse-heading-2">
          <a href="/services">All services</a>
        </div>
      </nav>
    </div>
    <div class="footer-bottom">
      <!-- Rendered dynamically, as the docs require the year to be. -->
      <p>&copy; <span id="year"></span> Example Federal Entity. All rights reserved.</p>
    </div>
  </footer>
  <script>document.getElementById("year").textContent = String(new Date().getFullYear());</script>
</body>
</html>
